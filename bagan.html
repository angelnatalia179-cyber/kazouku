<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのかぞく</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Baloo 2', sans-serif;
      background: #FFFDE7;
      background-image: 
        radial-gradient(circle at 15% 20%, #FFF9C4 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, #FFF59D 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #FFFFFF 0%, transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
      position: relative;
      overflow-x: hidden;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    body::before,
    body::after {
      content: "✿";
      position: fixed;
      color: #FFE082;
      font-size: 2.2rem;
      opacity: 0.8;
      animation: float 6s ease-in-out infinite;
      z-index: 1;
    }
    body::before { top: 10%; left: 8%; }
    body::after  { bottom: 15%; right: 10%; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-20px) rotate(15deg); }
    }

    /* TOMBOL KEMBALI */
    .btn-kembali {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: #FFFFFF;
      background: #FFC107;
      border: 3px solid #FFFFFF;
      padding: 10px 24px;
      border-radius: 22px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 5px 0 #E6A100, 0 8px 15px rgba(249, 168, 37, 0.4);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }
    .btn-kembali:hover  { background: #FFD54F; transform: translateY(-3px); }
    .btn-kembali:active { transform: translateY(3px); box-shadow: 0 2px 0 #E6A100; }

    .title-wrap {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      color: #F9A825;
      letter-spacing: 6px;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 #FFFFFF, 6px 6px 0 #FFF59D;
      animation: pop 2s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: scale(1); }
      to   { transform: scale(1.03); }
    }

    .subtitle {
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem;
      color: #FFFFFF;
      letter-spacing: 3px;
      font-weight: 700;
      background: #FFD54F;
      display: block;
      width: fit-content;
      margin: 0 auto 12px;
      padding: 7px 22px;
      border-radius: 22px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(249, 168, 37, 0.25);
    }

    .sub-judul {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 3px;
      background: #FFC107;
      display: block;
      width: fit-content;
      margin: 0 auto;
      padding: 7px 22px;
      border-radius: 22px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(249, 168, 37, 0.3);
    }

    .family-tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .family-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 45px;
      flex-wrap: wrap;
    }

    .member-card {
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 8px 0 #FFE082, 0 14px 24px rgba(249, 168, 37, 0.2);
      padding: 25px 20px 22px;
      width: 235px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 3px solid #FFF59D;
      position: relative;
    }

    .member-card:hover {
      transform: translateY(-10px) rotate(-1deg);
      box-shadow: 0 12px 0 #FFE082, 0 20px 32px rgba(249, 168, 37, 0.3);
    }

    .member-card::before {
      content: "🌼";
      position: absolute;
      top: -14px;
      right: -10px;
      font-size: 1.5rem;
      background: #FFF9C4;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(249, 168, 37, 0.25);
      z-index: 3;
    }

    .member-name {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 2rem;
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 18px;
      text-align: center;
      background: #FFD54F;
      padding: 4px 18px;
      border-radius: 14px;
      border: 2px solid #FFF59D;
      box-shadow: 0 3px 0 rgba(249, 168, 37, 0.3);
    }

    /* ====== KOTAK FOTO (OTOMATIS TAMPIL) ====== */
    .photo-box {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      background: #FFFDE7;
      border: 3px solid #FFE082;
      overflow: hidden;
      position: relative;
      transition: all 0.3s;
      transform: rotate(2deg);
      box-shadow: 0 4px 10px rgba(249, 168, 37, 0.2);
    }

    .member-card:nth-child(even) .photo-box {
      transform: rotate(-2deg);
    }

    .photo-box:hover {
      border-color: #FFD54F;
      transform: rotate(0deg) scale(1.05);
      box-shadow: 0 8px 20px rgba(249, 168, 37, 0.35);
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 17px;
    }

    .connector {
      width: 4px;
      height: 40px;
      background: repeating-linear-gradient(
        to bottom,
        #FFE082 0px, #FFE082 8px,
        #FFF59D 8px, #FFF59D 16px
      );
      margin: 0 auto;
      border-radius: 4px;
    }

    .intro-text {
      margin-top: 60px;
      max-width: 620px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 35px 40px;
      box-shadow: 0 8px 0 #FFE082, 0 14px 24px rgba(249, 168, 37, 0.2);
      border: 3px solid #FFF59D;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .intro-text::before {
      content: "📖";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      background: #FFD54F;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(249, 168, 37, 0.3);
    }

    .intro-text p {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.15rem;
      line-height: 2.2;
      color: #795548;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; letter-spacing: 4px; }
      .subtitle, .sub-judul { font-size: 0.85rem; }
      .family-row { flex-direction: column; align-items: center; gap: 30px; }
      .member-card { width: 205px; }
      .photo-box { width: 150px; height: 150px; }
      .intro-text { padding: 30px 22px; margin-top: 45px; }
      .intro-text p { font-size: 0.98rem; line-height: 2; }
      .btn-kembali { font-size: 0.8rem; padding: 8px 16px; top: 12px; left: 12px; }
    }
  </style>
</head>
<body>

  <button class="btn-kembali" onclick="kembaliKeLanding()">
    もどる
  </button>

  <div class="title-wrap">
    <h1>わたしの かぞく</h1>
    <p class="subtitle">Watashi no Kazoku</p>
    <p class="sub-judul">これは わたしの かぞくです</p>
  </div>

  <div class="family-tree">

    <!-- Baris Atas: Chichi & Haha -->
    <div class="family-row">
      <div class="member-card">
        <div class="member-name">ちち</div>
        <div class="photo-box">
          <img src="chichi.jpeg" alt="Chichi">
        </div>
      </div>

      <div class="member-card">
        <div class="member-name">はは</div>
        <div class="photo-box">
          <img src="haha.jpeg" alt="Haha">
        </div>
      </div>
    </div>

    <!-- Garis penghubung -->
    <div class="connector"></div>
    <div class="connector"></div>

    <!-- Baris Bawah: Watashi -->
    <div class="family-row">
      <div class="member-card">
        <div class="member-name">わたし</div>
        <div class="photo-box">
          <img src="watashi.jpeg" alt="Watashi">
        </div>
      </div>
    </div>

  </div>

  <div class="intro-text">
    <p>
      これは わたしの かぞくです。<br>
      わたしの かぞくは さんにんです。<br>
      わたしと ちちと ははです。<br>
      わたしは ひとりっこです。
    </p>
  </div>

  <script>
    function kembaliKeLanding() {
      document.body.style.transition = 'opacity 0.6s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    }
  </script>

</body>
</html>
