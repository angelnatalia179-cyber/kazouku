<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのかぞく</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Baloo 2', sans-serif;
      background: #FFFDE7;
      background-image: 
        radial-gradient(circle at 15% 20%, #FFF9C4 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, #FFF59D 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #FFFFFF 0%, transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    /* ====== ANIMASI LATAR ====== */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFE082, #FFD54F);
      opacity: 0.5;
      animation: mengambang linear infinite;
      box-shadow: 0 0 20px rgba(255, 213, 79, 0.6);
    }

    .c1 { width: 60px;  height: 60px;  left: 10%; top: 15%; animation-duration: 12s; }
    .c2 { width: 40px;  height: 40px;  left: 80%; top: 25%; animation-duration: 15s; animation-delay: 1s; }
    .c3 { width: 80px;  height: 80px;  left: 25%; top: 70%; animation-duration: 18s; animation-delay: 2s; }
    .c4 { width: 30px;  height: 30px;  left: 60%; top: 85%; animation-duration: 14s; animation-delay: 3s; }
    .c5 { width: 50px;  height: 50px;  left: 90%; top: 60%; animation-duration: 16s; animation-delay: 1.5s; }
    .c6 { width: 35px;  height: 35px;  left: 5%;  top: 80%; animation-duration: 13s; animation-delay: 2.5s; }
    .c7 { width: 70px;  height: 70px;  left: 70%; top: 10%; animation-duration: 20s; animation-delay: 0.5s; }
    .c8 { width: 45px;  height: 45px;  left: 45%; top: 40%; animation-duration: 17s; animation-delay: 4s; }

    @keyframes mengambang {
      0%   { transform: translateY(0) translateX(0) scale(1);        opacity: 0.3; }
      25%  { transform: translateY(-40px) translateX(20px) scale(1.1); opacity: 0.6; }
      50%  { transform: translateY(-80px) translateX(-15px) scale(1);  opacity: 0.5; }
      75%  { transform: translateY(-40px) translateX(25px) scale(1.15); opacity: 0.7; }
      100% { transform: translateY(0) translateX(0) scale(1);        opacity: 0.3; }
    }

    /* ====== KONTEN LANDING ====== */
    .landing-container {
      text-align: center;
      padding: 55px 45px;
      background: #FFFFFF;
      border-radius: 40px;
      border: 4px solid #FFF59D;
      box-shadow: 
        0 12px 0 #FFE082,
        0 20px 40px rgba(249, 168, 37, 0.3);
      position: relative;
      z-index: 2;
      max-width: 520px;
      animation: muncul 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes muncul {
      from { transform: scale(0.7) translateY(30px); opacity: 0; }
      to   { transform: scale(1) translateY(0);      opacity: 1; }
    }

    .landing-title {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: #F9A825;
      letter-spacing: 5px;
      margin-bottom: 15px;
      text-shadow: 
        3px 3px 0 #FFFFFF,
        6px 6px 0 #FFF59D;
      animation: pop 2s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to   { transform: scale(1.04); }
    }

    .landing-subtitle {
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem;
      color: #FFFFFF;
      letter-spacing: 3px;
      font-weight: 700;
      background: #FFD54F;
      display: inline-block;
      padding: 7px 22px;
      border-radius: 22px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(249, 168, 37, 0.25);
      margin-bottom: 20px;
    }

    .landing-desc {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1rem;
      color: #795548;
      font-weight: 700;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .btn-masuk {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #FFFFFF;
      background: #FFC107;
      border: 3px solid #FFFFFF;
      padding: 16px 36px;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 
        0 8px 0 #E6A100,
        0 12px 20px rgba(249, 168, 37, 0.4);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-masuk:hover {
      background: #FFD54F;
      transform: translateY(-4px);
      box-shadow: 
        0 12px 0 #E6A100,
        0 18px 30px rgba(249, 168, 37, 0.5);
    }

    .btn-masuk:active {
      transform: translateY(4px);
      box-shadow: 
        0 4px 0 #E6A100,
        0 6px 12px rgba(249, 168, 37, 0.4);
    }

    .landing-hint {
      font-size: 0.85rem;
      color: #A1887F;
      margin-top: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    @media (max-width: 768px) {
      .landing-container {
        padding: 40px 25px;
        margin: 20px;
        max-width: 90%;
      }
      .landing-title { font-size: 2rem; letter-spacing: 3px; }
      .landing-subtitle { font-size: 0.85rem; }
      .landing-desc { font-size: 0.9rem; }
      .btn-masuk { font-size: 1rem; padding: 14px 28px; }
    }
  </style>
</head>
<body>

  <div class="bg-animation">
    <span class="circle c1"></span>
    <span class="circle c2"></span>
    <span class="circle c3"></span>
    <span class="circle c4"></span>
    <span class="circle c5"></span>
    <span class="circle c6"></span>
    <span class="circle c7"></span>
    <span class="circle c8"></span>
  </div>

  <div class="landing-container">
    <h1 class="landing-title">わたしの かぞく</h1>
    <p class="landing-subtitle">Watashi no Kazoku</p>
    <p class="landing-desc">ようこそ！ わたしの かぞくの ずです</p>
    
    <button class="btn-masuk" onclick="masukBagan()">
      かぞくの ずを みる
    </button>

    <p class="landing-hint">ボタンを おしてね</p>
  </div>

  <script>
    function masukBagan() {
      document.body.style.transition = 'opacity 0.6s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'bagan.html';
      }, 600);
    }
  </script>

</body>
</html>
